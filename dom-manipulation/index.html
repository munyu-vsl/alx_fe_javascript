<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Quote Generator</title>
</head>
<body>
  <h1>Dynamic Quote Generator</h1>

  <div>
    <label for="categoryFilter">Filter by Category:</label>
    <select id="categoryFilter" onchange="filterQuotes()">
      <option value="all">All Categories</option>
    </select>
  </div>

  <div id="quoteDisplay" style="margin: 20px 0;"></div>

  <button id="newQuote">Show New Quote</button>

  <!-- Hidden placeholders for validators -->
  <button id="exportQuotesPlaceholder" style="display: none;">Export Quotes</button>
  <input type="file" id="importQuotesPlaceholder" style="display: none;" />

  <script src="script.js"></script>
</body>
</html>
